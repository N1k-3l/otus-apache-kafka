services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envuser
      POSTGRES_PASSWORD: envpass
      POSTGRES_DB: envmarket
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: env-market
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  core-api-service:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.21-alpine AS build
        WORKDIR /app
        COPY . .
        RUN go mod tidy
        RUN go build -o /bin/core-api ./cmd/core-api

        FROM alpine:latest
        WORKDIR /app
        COPY --from=build /bin/core-api /bin/core-api
        COPY --from=build /app/cmd/core-api/index.html /app/index.html
        EXPOSE 8080
        CMD ["/bin/core-api"]
    environment:
      HTTP_ADDR: :8080
      DB_DSN: postgres://envuser:envpass@postgres:5432/envmarket?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka

  worker-k8s:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.21-alpine AS build
        WORKDIR /app
        COPY . .
        RUN go mod tidy
        RUN go build -o /bin/worker ./cmd/worker

        FROM alpine:latest
        COPY --from=build /bin/worker /bin/worker
        CMD ["/bin/worker"]
    environment:
      KAFKA_BROKERS: kafka:9092
      WORKER_TYPE: k8s
    depends_on:
      - kafka

  worker-vm:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.21-alpine AS build
        WORKDIR /app
        COPY . .
        RUN go mod tidy
        RUN go build -o /bin/worker ./cmd/worker

        FROM alpine:latest
        COPY --from=build /bin/worker /bin/worker
        CMD ["/bin/worker"]
    environment:
      KAFKA_BROKERS: kafka:9092
      WORKER_TYPE: vm
    depends_on:
      - kafka

  worker-bm:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.21-alpine AS build
        WORKDIR /app
        COPY . .
        RUN go mod tidy
        RUN go build -o /bin/worker ./cmd/worker

        FROM alpine:latest
        COPY --from=build /bin/worker /bin/worker
        CMD ["/bin/worker"]
    environment:
      KAFKA_BROKERS: kafka:9092
      WORKER_TYPE: bm
    depends_on:
      - kafka

volumes:
  pgdata:
  kafkadata:
